<style>
  .test-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 0 .75rem; }
  .test-actions button.stop { background: var(--danger); }
  .test-actions button.restart { background: var(--warning); }
  .test-actions button.approve { background: var(--success); }
</style>
<form class="test-actions" method="post" aria-label="Test {{ test.id }}">{% csrf_token %}
  {% if not test.approved %}<span class="badge waiting">not approved</span>{% endif %}
  {% for action in buttons %}<button class="act {{ action }}" formaction="{% url 'test_action' test.id action %}">{{ action|capfirst }}</button>{% endfor %}
</form>

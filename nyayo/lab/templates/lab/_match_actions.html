<div class="side-actions" role="group" aria-label="Actions for this match">
  <h5>Actions for this match</h5>
  {% if match.hidden %}
  <form method="post" action="{% url 'match_restore' %}">{% csrf_token %}<input type="hidden" name="id" value="{{ match.pk }}">
    <button class="side-act bring" type="submit">Bring it back</button></form>
  {% else %}
  {% if test and not test.approved %}<p class="side-note">Not approved: no worker gets it.</p>{% endif %}
  {% if buttons %}<form method="post" aria-label="Test {{ test.id }}">{% csrf_token %}
    {% for action in buttons %}<button class="side-act {{ action }}" formaction="{% url 'test_action' test.id action %}" type="submit">{{ action|capfirst }}</button>{% endfor %}
  </form>{% endif %}
  <div class="side-links">
    <a class="side-act remove" href="{% url 'match_remove' %}?id={{ match.pk|urlencode }}&amp;mode=remove">Remove…</a>
    <a class="side-act delete" href="{% url 'match_remove' %}?id={{ match.pk|urlencode }}&amp;mode=delete">Delete…</a>
  </div>
  {% endif %}
</div>

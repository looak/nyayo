<style>
  /* a tooltip that opens on hover, on focus (the keyboard) and on a tap, which focuses it */
  .tip { position: relative; display: inline-flex; align-items: center; gap: .3rem; cursor: help; border-radius: 3px; }
  .tip:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .tip-text { display: none; position: absolute; z-index: 20; left: 0; top: calc(100% + 6px); width: max-content; max-width: min(19rem, 80vw);
    padding: .4rem .6rem; border-radius: 4px; background: var(--side-head); color: var(--bright); border: 1px solid var(--line);
    font-size: .8rem; font-weight: 400; line-height: 1.35; white-space: normal; text-align: left; box-shadow: 0 4px 12px rgba(0, 0, 0, .4); }
  .tip:hover .tip-text, .tip:focus .tip-text, .tip.open .tip-text { display: block; }
  .tip.flip .tip-text { left: auto; right: 0; }
  .tip.up .tip-text { top: auto; bottom: calc(100% + 6px); }
  .tip-text b { color: var(--bright); }
  .tip-text ul { margin: 0; padding-left: 1.1rem; }

  /* the status: a network icon, coloured, with its words beside it */
  .net { display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; font-weight: 600; }
  .net svg { width: 1.15rem; height: 1.15rem; flex: none; }
  .net.offline, .net.held { color: var(--muted); }
  .net.warn { color: var(--wip); }
  .net.ok { color: var(--success); }
  .net.ok .net-words { color: var(--fg); font-weight: 400; }
  .net.warn .net-words { color: var(--wip); }
  .net.offline .net-words, .net.held .net-words { font-weight: 400; }

  /* the Enabled toggle: a wide thumb that slides right and turns the track green when on */
  button.toggle { appearance: none; position: relative; display: block; flex: none; box-sizing: border-box; width: 34px; height: 18px; margin: 0; padding: 0;
    border: 1px solid var(--muted); border-radius: 9px; background: var(--code-bg); cursor: pointer; outline: none; transition: background .15s, border-color .15s; }
  button.toggle i { position: absolute; top: 2px; left: 2px; width: 18px; height: 12px; border-radius: 6px; background: var(--muted); transition: left .15s, background .15s; }
  button.toggle[aria-checked=true] { background: var(--success); border-color: var(--success); }
  button.toggle[aria-checked=true] i { left: 12px; background: var(--bright); }
  button.toggle:focus-visible { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--link); }

  /* a row's actions: the toggle or Approve in one slot, so Turn away lines up under itself */
  .row-actions { display: grid; grid-template-columns: 52px auto; align-items: center; justify-content: start; gap: .5rem; margin: 0; }
  button.mini { appearance: none; margin: 0; padding: 1px 7px; border: 1px solid var(--muted); border-radius: 9px; background: none; color: var(--fg);
    font: inherit; font-size: .7rem; line-height: 16px; white-space: nowrap; cursor: pointer; }
  button.mini:hover { border-color: var(--worse); color: var(--worse); }
  button.mini.go { padding: 1px 0; border-color: var(--accent); background: var(--accent); color: #fff; }
  button.mini.go:hover { border-color: var(--link); background: var(--link); color: #fff; }
  button.mini:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .os { display: inline-flex; align-items: center; gap: .3rem; vertical-align: middle; }
  .os svg { width: 1.1rem; height: 1.1rem; flex: none; fill: currentColor; color: var(--muted); }
  .os .wsl { font-size: .7rem; font-weight: 700; padding: 0 .3rem; border-radius: 3px; color: var(--committed); background: var(--committed-bg); }

  .flagpills { display: flex; flex-wrap: wrap; gap: .3rem; margin: .4rem 0 0; }
  .flagpill { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--muted); background: var(--code-bg); border: 1px solid var(--line); }
  .flagpill.known { color: var(--fg); border-color: var(--accent); }
  .place { color: var(--muted); }
  .place-form { display: inline-flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .25rem; }
  .place-form input[type=text] { max-width: 16rem; }
  .sect-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
  .sect-grid .card { margin: 0; }
  .sect-grid dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .25rem .9rem; }
  .sect-grid dt { color: var(--muted); }
  .sect-grid dd { margin: 0; word-break: break-word; }
</style>
<script>
  // a tooltip near the right edge opens leftwards; a tap on one toggles it, for a phone that has no hover
  document.addEventListener('DOMContentLoaded', function () {
    var tips = document.querySelectorAll('.tip');
    function place(tip) {
      tip.classList.remove('flip', 'up');
      var box = tip.querySelector('.tip-text');
      var shown = box.style.display;
      box.style.display = 'block';
      var edge = box.getBoundingClientRect();
      var holder = tip.closest('.scroll');
      var floor = holder ? holder.getBoundingClientRect().bottom : window.innerHeight;
      if (edge.right > document.documentElement.clientWidth - 8) tip.classList.add('flip');
      if (edge.bottom > floor) tip.classList.add('up');
      box.style.display = shown;
    }
    tips.forEach(function (tip) {
      ['mouseenter', 'focus'].forEach(function (e) { tip.addEventListener(e, function () { place(tip); }); });
      tip.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        tip.classList.toggle('open');
        place(tip);
      });
      tip.addEventListener('blur', function () { tip.classList.remove('open'); });
      tip.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { tip.classList.remove('open'); tip.blur(); }
      });
    });
  });
</script>

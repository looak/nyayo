{# approve, turn away, enable and disable, as the worker's state allows; each is logged #}
<form method="post" action="{% url 'machine_action' %}" class="row-actions">{% csrf_token %}
  <input type="hidden" name="id" value="{{ r.id }}"><input type="hidden" name="back" value="{{ back }}">
  {% if r.registration == "approved" %}{% include "lab/_enable_toggle.html" with enabled=r.enabled name=r.name %}{% else %}<button class="mini go" name="action" value="approve" type="submit">Approve</button>{% endif %}
  {% if r.registration != "turned_away" %}<button class="mini" name="action" value="turn_away" type="submit">Turn away</button>{% endif %}
</form>

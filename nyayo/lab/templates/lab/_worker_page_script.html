<script>
  // the graph's hours: point at one, tap it, or use the arrow keys, and its details are written below the chart
  (function () {
    var body = document.getElementById('hours');
    if (!body) return;
    var readout = document.getElementById('readout');
    var cols = body.querySelectorAll('.col'), cells = body.querySelectorAll('.cell');
    var current = -1, standard = readout.textContent;
    function show(i) {
      if (i < 0 || i >= cols.length) return;
      if (current >= 0) { cols[current].classList.remove('hl'); cells[current].classList.remove('hl'); }
      current = i;
      cols[i].classList.add('hl'); cells[i].classList.add('hl');
      readout.textContent = cols[i].dataset.tip;
    }
    function hide() {
      if (current >= 0) { cols[current].classList.remove('hl'); cells[current].classList.remove('hl'); }
      current = -1; readout.textContent = standard;
    }
    function index(e) {
      var el = e.target.closest ? e.target.closest('[data-i]') : null;
      return el ? parseInt(el.dataset.i, 10) : -1;
    }
    body.addEventListener('mouseover', function (e) { var i = index(e); if (i >= 0) show(i); });
    body.addEventListener('mouseleave', function () { if (document.activeElement !== body) hide(); });
    body.addEventListener('click', function (e) { var i = index(e); if (i >= 0) show(i); });
    body.addEventListener('blur', hide);
    body.addEventListener('keydown', function (e) {
      var to = null;
      if (e.key === 'ArrowLeft') to = current < 0 ? cols.length - 1 : current - 1;
      else if (e.key === 'ArrowRight') to = current < 0 ? cols.length - 1 : current + 1;
      else if (e.key === 'Home') to = 0;
      else if (e.key === 'End') to = cols.length - 1;
      else if (e.key === 'Escape') { hide(); return; }
      if (to === null) return;
      e.preventDefault();
      show(Math.max(0, Math.min(cols.length - 1, to)));
    });
  })();
</script>

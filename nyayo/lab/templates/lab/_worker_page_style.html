<style>
  /* a box's page, as the board WorkerB.dc.html has it: the 48-hour graph, four blocks in a row, then what the machine is */
  .pagehead { margin-bottom: 16px; gap: 4px 12px; } .pagehead h1 { font-size: 21px; }
  .os-badge { display: inline-flex; align-items: center; gap: .3rem; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600;
              background: var(--code-bg); color: var(--muted); }
  .os-badge .os svg { width: .95rem; height: .95rem; }
  .wpage { display: flex; flex-direction: column; gap: 16px; }
  .wsec { background: var(--card); border-radius: 3px; padding: 12px 16px; min-width: 0; }
  .wsec h2 { margin: 0 0 8px; font-size: 15px; color: var(--bright); }
  .wsec .right { float: right; font-weight: 400; font-size: .85rem; }
  .graph { border-top: 3px solid #3c8dbc; display: flex; flex-direction: column; gap: 8px; }
  .graph h2 { margin: 0; }
  .graph-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .sw.bar { background: var(--info); } .sw.line { width: 14px; height: 2px; background: var(--wip); }
  .sw.on { background: var(--success); } .sw.part { background: var(--success); opacity: .5; } .sw.off { background: #4b545c; }
  .graph-scroll { overflow-x: auto; }
  .graph-body { min-width: 640px; display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; gap: 0 8px; border-radius: 3px; }
  .graph-body:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .y { display: flex; flex-direction: column; justify-content: space-between; height: 200px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .y-left { text-align: right; } .y-right { color: var(--wip); }
  .plot { position: relative; height: 200px; border-bottom: 1px solid #4b545c; border-top: 1px dashed var(--line); }
  .plot .mid { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
  .plot .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px; align-items: end; }
  .plot .col { position: relative; display: flex; align-items: flex-end; height: 100%; cursor: default; }
  .plot .col .bar { display: block; width: 100%; min-height: 1px; background: var(--info); border-radius: 2px 2px 0 0; }
  /* an hour before the record began is blank, with only the faint line of its hour; a hovered real hour is lit a little */
  .plot .col.none { background: linear-gradient(to right, transparent calc(100% - 1px), rgba(255, 255, 255, .06) 0); }
  .plot .col.none .bar { display: none; }
  .plot .col.hl { background: rgba(255, 255, 255, .045); } .plot .col.hl .bar { background: #1ba3bd; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .plot, .strip, .xs { min-width: 0; }
  .graph-note { position: absolute; left: 8px; top: 6px; margin: 0; font-size: 11px; color: var(--muted); opacity: .8; pointer-events: none; }
  .graph-note.dim { visibility: hidden; }
  .chip { position: absolute; top: 6px; z-index: 3; max-width: 70%; padding: 3px 8px; border-radius: 3px; background: #22272b; border: 1px solid var(--line);
          color: var(--bright); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .chip.l { left: 8px; } .chip.r { right: 8px; }
  .y-label { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .strip { display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px; margin-top: 6px; height: 12px; }
  .strip .cell { border-radius: 2px; background: #4b545c; }
  .strip .cell.on { background: var(--success); } .strip .cell.part { background: var(--success); opacity: .5; }
  .strip .cell.none { background: rgba(255, 255, 255, .05); }
  .strip .cell.hl { filter: brightness(1.35); }
  .xs { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

  .wtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1100px) { .wtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .wtiles { grid-template-columns: minmax(0, 1fr); } }
  .wtile { padding: 10px 12px; border-radius: 3px; color: #fff; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wtile.success { background: var(--success); } .wtile.info { background: var(--info); } .wtile.warning { background: var(--warning); }
  .wtile.grey { background: #4b545c; gap: 4px; } .wtile.ink { color: #1d2125; }
  .wtile-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .wtile .big { font-size: 29px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .wtile .big.mid { font-size: 1.6rem; }
  .wtile .big.small { font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
  .wtile .sub { font-size: 11px; }
  .wtile .why { font-weight: 600; } .wtile .hot { font-weight: 800; }
  .wtile a { color: inherit; text-decoration: none; } .wtile a:hover { text-decoration: underline; }

  .worker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; align-items: start; }
  .wsec.trouble p { margin: .3rem 0; }
  .kv { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--bright); }
  .flags { margin-top: 12px; } .flags > .muted { font-size: 12px; margin-bottom: 6px; } .flags .count { color: var(--fg); }
  .flagpills { gap: 6px; margin: 0; }
  .wsec .flagpill { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--code-bg);
                    color: var(--fg); font: 600 12px/1 ui-monospace, Consolas, monospace; }
  .tools { margin: 0; padding: 0; list-style: none; }
  .tools li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
  .wsec h2 + .tools { margin-top: 6px; }
  .tools .lang { justify-self: start; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .tools .tool { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--bright); overflow-wrap: anywhere; }
  .tools .ver { font-size: 13px; color: var(--fg); }
  .tools li.missing .tool, .tools li.missing .ver { color: var(--muted); }
  .lang-cpp { background: #f7a8c4; color: #3a1020; } .lang-c { background: #a9c1ef; color: #10213f; } .lang-cs { background: #a6e3a1; color: #10310d; }
  .lang-rust { background: #f4b183; color: #3b1c08; } .lang-python { background: #f5dd7a; color: #332a05; } .lang-build { background: #c9b8f2; color: #22163f; }
  .lang-tool { background: #b9c3cb; color: #1d2125; } .lang-gone { background: var(--line); color: var(--fg); }
  @media (max-width: 700px) { .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: .35rem; } }

  /* a worker waiting for approval (or turned away): what it said, what it could play, and the two buttons */
  .pending-head { display: flex; align-items: center; gap: .8rem 1rem; margin: 0; }
  .pending-icon { display: inline-flex; flex: none; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 50%;
                  background: var(--wip-bg); color: var(--wip); }
  .pending-head.turned_away .pending-icon { background: var(--code-bg); color: var(--muted); }
  .pending-line { color: var(--wip); font-size: 1.05rem; } .pending-head.turned_away .pending-line { color: var(--muted); }
  .pending-box { margin: 0; } .pending-box > p { margin-top: 0; }
  .facts { display: flex; flex-wrap: wrap; gap: .4rem 2rem; margin: .5rem 0 .9rem; }
  .facts dt { font-size: .8rem; color: var(--muted); } .facts dd { margin: 0; font-weight: 600; color: var(--bright); }
  .pending-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .pending-actions button { min-height: 44px; padding: 0 1.2rem; border-radius: 3px; font: inherit; cursor: pointer; }
  .pending-actions .approve { border: 0; background: var(--success); color: #fff; font-weight: 600; }
  .pending-actions .away { border: 1px solid var(--line); background: var(--code-bg); color: var(--fg); }
  .job { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .4rem; }
  .job li { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: baseline; }
  .jstate { padding: 0 .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .jstate.done { color: var(--published); background: var(--published-bg); } .jstate.todo { color: var(--wip); background: var(--wip-bg); }
  .jname { color: var(--bright); }
  .abilities { margin: 0; } .abilities h3 { margin: 0 0 8px; font-size: 15px; color: var(--bright); }
  .ability-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); gap: .75rem; }
  .ability { padding: .6rem .8rem; border-radius: 3px; background: var(--card); border-top: 3px solid #4b545c; }
  .ability.yes { border-top-color: var(--success); } .ability b { color: var(--bright); }
  .ability .astate { font-size: .85rem; color: var(--muted); } .ability.yes .astate { color: var(--published); }
  .ability .muted { font-size: .75rem; }

  /* the Enabled switch in the Approval tile */
  .switch-form { margin-top: .3rem; } .away-form { margin: 0; }
  .switch { display: flex; align-items: center; gap: .5rem; min-height: 32px; font-size: .85rem; font-weight: 600; }
  .linkish { padding: 0; border: 0; background: none; color: #fff; font: inherit; font-size: .75rem; opacity: .85; text-decoration: underline dotted; cursor: pointer; min-height: 40px; }
</style>

{% load runs_extras matches_extras %}
{# an SPRT's Elo and LLR over games, from the snapshots, side by side #}
<div class="columns">
{% for g in graphs %}
<div class="card">
<h3 class="box-title">{{ g.label }} over games <span class="right muted">{% if g.band %}with its 95% interval{% else %}with its bounds{% endif %}</span></h3>
<svg class="chart" viewBox="0 0 {{ g.width }} {{ g.height }}" role="img" aria-label="{{ g.label }} over games">
  {% for t in g.yticks %}
  <line x1="{{ g.left }}" x2="{{ g.right }}" y1="{{ t.y }}" y2="{{ t.y }}" class="grid"/>
  <text x="{{ g.left|add:'-6' }}" y="{{ t.y }}" class="tick" text-anchor="end" dominant-baseline="middle">{{ t.label }}</text>
  {% endfor %}
  {% for t in g.xticks %}<text x="{{ t.x }}" y="{{ g.bottom|add:'16' }}" class="tick" text-anchor="middle">{{ t.label }}</text>{% endfor %}
  {% if g.band %}<polygon points="{{ g.band }}" class="band"/>{% endif %}
  {% for m in g.marks %}
  <line x1="{{ g.left }}" x2="{{ g.right }}" y1="{{ m.y }}" y2="{{ m.y }}" class="axis bound"/>
  <text x="{{ g.right }}" y="{{ m.y|add:'-3' }}" class="tick" text-anchor="end">{{ m.label }}</text>
  {% endfor %}
  <polyline points="{{ g.line }}" class="series white"/>
  <circle cx="{{ g.last.x }}" cy="{{ g.last.y }}" r="3" class="dot-white"/>
</svg>
</div>
{% endfor %}
</div>

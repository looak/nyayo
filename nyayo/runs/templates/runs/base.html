{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}nyayo{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #fbfbf9; --fg: #1d1f21; --muted: #6b6f76; --line: #e2e2dc; --card: #ffffff; --link: #2357b5;
    --wip: #8a6d00; --wip-bg: #fff4c2; --committed: #2357b5; --committed-bg: #e3ecfb;
    --published: #1f7a3d; --published-bg: #dff3e5; --worse: #b3261e; --better: #1f7a3d; --error-bg: #fde7e5;
    --code-bg: #f1f1ec; --cell-pass: #2da44e; --cell-fail: #cf222e; --cell-newly-failing: #8250df;
    --cell-newly-passing: #0969da;
    --smoke: #6a3fb5; --smoke-bg: #efe7fb; --extended: #a12a7a; --extended-bg: #fbe6f3;
    --series-white: #2357b5; --series-black: #c2561a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #e6e6e3; --muted: #9a9ea6; --line: #2e3034; --card: #1e2023; --link: #8ab4f8;
      --wip: #f2d36b; --wip-bg: #3a3214; --committed: #8ab4f8; --committed-bg: #1d2a40;
      --published: #7fd49a; --published-bg: #173222; --worse: #f28b82; --better: #7fd49a; --error-bg: #3b1f1d;
      --code-bg: #26282c; --cell-pass: #2ea043; --cell-fail: #da3633; --cell-newly-failing: #a371f7;
      --cell-newly-passing: #388bfd;
      --smoke: #c4a7f5; --smoke-bg: #2d2342; --extended: #f0a3d6; --extended-bg: #3d1f33;
      --series-white: #8ab4f8; --series-black: #f0a35e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; gap: 1.5rem; align-items: baseline; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 700; font-size: 1.1rem; color: var(--fg); }
  main { padding: 1rem; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: .25rem 0 .75rem; }
  h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
  h3 { font-size: .95rem; margin: 1rem 0 .25rem; }
  .muted { color: var(--muted); }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .92em; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 0 .45rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }
  .badge.wip { color: var(--wip); background: var(--wip-bg); }
  .badge.committed { color: var(--committed); background: var(--committed-bg); }
  .badge.published { color: var(--published); background: var(--published-bg); }
  .tier { display: inline-block; padding: 0 .45rem; border-radius: 4px; font-size: .78rem; font-weight: 600;
          color: var(--muted); background: var(--code-bg); }
  .tier.smoke { color: var(--smoke); background: var(--smoke-bg); }
  .tier.extended { color: var(--extended); background: var(--extended-bg); }
  .status-fail, .status-error, .worse { color: var(--worse); }
  .status-pass, .better { color: var(--better); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; margin: .75rem 0; }
  .card-head { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; }
  .card-head h3 { margin: 0; }
  .card-head .outcome { margin-left: auto; }
  .card-head .timing { font-size: .85rem; font-variant-numeric: tabular-nums; }
  .card-head .params { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: .3rem; margin: .4rem 0 .6rem; }
  .params code { padding: .05rem .4rem; border: 1px solid var(--line); border-radius: 4px; background: var(--code-bg); }
  .outcome { padding: .05rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 700; text-transform: uppercase;
             letter-spacing: .03em; color: var(--worse); background: var(--error-bg); }
  .outcome.pass { color: var(--better); background: var(--published-bg); }
  .outcome.warn { color: var(--wip); background: var(--wip-bg); }
  .outcome.none, .outcome.skipped { color: var(--muted); background: var(--code-bg); }
  .score { margin: .25rem 0 .5rem; }
  .score-row { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; align-items: center; margin: .35rem 0; }
  .score-figure { display: flex; gap: .5rem; align-items: baseline; min-width: 14rem; }
  .score-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .score-total { font-size: 1rem; font-weight: 400; color: var(--muted); }
  .score-label { font-size: .85rem; }
  .delta { font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 .4rem; border-radius: 4px;
           background: var(--code-bg); }
  .bar-wrap { flex: 1 1 18rem; }
  .bar { position: relative; display: flex; height: 14px; border-radius: 3px; background: var(--code-bg); }
  .seg { height: 100%; }
  .seg:first-child { border-radius: 3px 0 0 3px; }
  .seg.pass { background: var(--cell-pass); }
  .seg.fail { background: var(--cell-fail); }
  .seg.newly-passing { background: var(--cell-newly-passing); }
  .seg.newly-failing { background: var(--cell-newly-failing); }
  .seg.unearned { background: transparent; }
  .mark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px solid var(--fg); }
  .mark.base, .mark-key.base { border-left-color: var(--link); }
  .mark.minimum, .mark-key.minimum { border-left-style: dashed; }
  .mark.baseline, .mark-key.baseline { border-left-style: dotted; }
  .marks { display: flex; flex-wrap: wrap; gap: .1rem 1rem; font-size: .78rem; margin-top: .35rem; }
  .mark-key { display: inline-block; width: 0; height: .8rem; margin-right: .35rem; vertical-align: -2px;
              border-left: 2px solid var(--fg); }
  .score-base { font-size: .85rem; margin-top: .2rem; }
  details.positions { margin: .5rem 0; }
  .cell-row { display: flex; flex-wrap: wrap; gap: .2rem .75rem; align-items: center; margin: .3rem 0; }
  .cell-label { width: 8rem; font-size: .85rem; white-space: nowrap; }
  .cells { display: flex; flex-wrap: wrap; gap: 3px; flex: 1 1 20rem; }
  .cell { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--cell-fail); }
  .cell.pass { background: var(--cell-pass); }
  .cell.newly-failing { background: var(--cell-newly-failing); }
  .cell.newly-passing { background: var(--cell-newly-passing); }
  .legend { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .8rem; margin: .25rem 0 .4rem; }
  .legend .cell { width: 10px; height: 10px; margin-right: .3rem; vertical-align: -1px; }
  .cell:hover, .cell:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: .15rem 1rem; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  form.filters { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: end; margin-bottom: .75rem; }
  form.filters label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); }
  select, input, button { font: inherit; padding: .25rem .4rem; max-width: 100%; }
  details > summary { cursor: pointer; margin: .4rem 0; }
  .note { padding: .4rem .7rem; border-radius: 6px; background: var(--error-bg); }
  .tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
  .tabs a { padding: .15rem .6rem; border: 1px solid var(--line); border-radius: 6px; }
  .tabs a.current { background: var(--card); font-weight: 600; }
  .position { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: flex-start; margin-bottom: 1rem; }
  .position .facts { flex: 1 1 18rem; }
  .board { width: 100%; max-width: 360px; }
  .board svg { display: block; width: 100%; height: auto; }
  .nowrap { white-space: nowrap; }
  .run-summary { display: flex; flex-wrap: wrap; gap: .3rem .75rem; align-items: center; }
  .run-summary .outcome { min-width: 7.5rem; text-align: center; }
  .mini-bar { display: inline-flex; width: 8rem; height: 8px; border-radius: 3px; overflow: hidden;
              background: var(--cell-fail); }
  .mini-figure { font-variant-numeric: tabular-nums; min-width: 5.5rem; }
  .check-dots { display: inline-flex; gap: 3px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--muted); }
  .dot.pass { background: var(--cell-pass); }
  .dot.warn { background: var(--wip); }
  .dot.fail, .dot.error { background: var(--cell-fail); }
  .pager { margin-top: .75rem; display: flex; gap: 1rem; }
  .badge.running { color: var(--better); background: var(--published-bg); }
  .badge.finished { color: var(--committed); background: var(--committed-bg); }
  .badge.stopped { color: var(--wip); background: var(--wip-bg); }
  .chart .band { fill: var(--cell-newly-passing); opacity: .16; }
  .chart .bound { stroke-dasharray: 4 3; }
  .sprt-figures { gap: .25rem 2.5rem; }
  .sprt-figures .score-figure { min-width: 0; flex-direction: column; gap: 0; align-items: flex-start; }
  .sprt-figures .score-value { font-size: 2rem; }
  .sprt-bar { margin: .35rem 0 .5rem; }
  .marks-end { margin-left: auto; }
  .sprt-track .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .sprt-track .fill.pass { background: var(--cell-pass); }
  .sprt-track .fill.fail { background: var(--cell-fail); }
  .sprt-track .mark.zero { top: -5px; bottom: -5px; border-left-width: 3px; }
  .sprt-marks { position: relative; }
  .sprt-zero { position: absolute; transform: translateX(-50%); }
  .chip-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: .25rem 2rem;
                 margin-top: .6rem; }
  .chip-groups h4 { margin: .5rem 0 0; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase;
                    color: var(--muted); }
  .vs { opacity: .7; }
  a.running-card { display: block; color: var(--fg); margin: .5rem 0 .75rem; }
  a.running-card:hover { border-color: var(--link); text-decoration: none; }
  a.running-card .card-head h3 { color: var(--link); }
  .sprt-columns { align-items: stretch; margin: .5rem 0 .75rem; }
  .sprt-columns .stack { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
  .sprt-columns .stack > .card, .sprt-columns > .card { margin: 0; }
  .sprt-columns .copy-field { resize: none; }
  .stored { margin: .6rem 0 0; font-size: .85rem; }
  table.workers td { vertical-align: baseline; }
  tr.spec-row td { padding-top: 0; font-size: .85rem; }
  details.flags { display: inline; margin-left: .4rem; }
  details.flags summary { display: inline; cursor: pointer; }
  .pillars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .75rem; height: 10rem;
             margin: 1rem 0 .4rem; align-items: end; border-bottom: 1px solid var(--line); }
  .pillar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%;
                min-width: 0; }
  .pillar-count { font-size: .8rem; font-variant-numeric: tabular-nums; }
  .pillar { display: block; width: 100%; max-width: 3.2rem; min-height: 2px; border-radius: 3px 3px 0 0;
            background: var(--muted); }
  .pillar.ll { background: var(--cell-fail); }
  .pillar.ld { background: color-mix(in srgb, var(--cell-fail) 60%, white); }
  .pillar.dd { background: var(--muted); }
  .pillar.dw { background: color-mix(in srgb, var(--cell-pass) 60%, white); }
  .pillar.ww { background: var(--cell-pass); }
  .pillar-label { font-size: .75rem; margin-top: .15rem; }
  table.penta { width: auto; margin: .6rem 0 .2rem; }
  table.penta th, table.penta td { padding: .15rem .8rem; }
  .graph-title { margin: 1rem 0 .3rem; font-size: .9rem; }
  .badge.silent, .outcome.silent { color: var(--wip); background: var(--wip-bg); }
  .badge.error { color: var(--worse); background: var(--error-bg); }
  .outcome-win { color: var(--better); font-weight: 600; }
  .outcome-loss { color: var(--worse); font-weight: 600; }
  .outcome-draw { color: var(--muted); font-weight: 600; }
  .boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .75rem; }
  .live-board { display: block; padding: .5rem; border: 1px solid var(--line); border-radius: 8px;
                background: var(--card); color: var(--fg); }
  .live-board:hover { border-color: var(--link); text-decoration: none; }
  .live-board-svg svg { display: block; width: 100%; height: auto; }
  .live-board-caption { margin-top: .4rem; font-size: .85rem; overflow-wrap: anywhere; }
  .moves-panel { flex: 1 1 20rem; min-width: 0; }
  .evalgraph { display: block; width: 100%; max-width: 420px; margin-top: .75rem; background: var(--code-bg);
               border-radius: 4px; }
  .evalgraph .axis { stroke: var(--line); stroke-width: 1; }
  .evalgraph .line { fill: none; stroke: var(--link); stroke-width: 1.5; }
  .evalgraph .cursor { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 3 3; }
  table.moves td.here { background: var(--committed-bg); font-weight: 700; }
  table.moves td, table.moves th { padding: .15rem .45rem; }

  /* the game page: board and moves side by side; graphs stretch under both columns */
  .game-layout { display: grid; gap: 1rem 1.5rem; align-items: stretch;
                 grid-template-columns: minmax(300px, min(62%, calc(100vh - 12rem))) minmax(320px, 1fr); }
  @media (max-width: 900px) { .game-layout { grid-template-columns: minmax(0, 1fr); } }
  .board-col, .side-col { display: flex; flex-direction: column; min-height: 100%; }
  .side-col { min-height: 0; }
  .game-status { margin: 0 0 .5rem; }
  .board-frame svg { display: block; width: 100%; height: auto; }
  .board-nav { margin: .4rem 0 0; font-size: 1.1rem; display: flex; gap: .9rem; align-items: baseline; }
  .player-bar { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .3rem .6rem;
                background: var(--card); border: 1px solid var(--line); }
  .player-bar:first-child { border-radius: 8px 8px 0 0; border-bottom: 0; }
  .player-bar:last-of-type { border-radius: 0 0 8px 8px; border-top: 0; }
  .player-bar.on-move { box-shadow: inset 3px 0 0 var(--published); }
  .clock { font: 700 1.3rem ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums;
           padding: 0 .55rem; border-radius: 4px; background: var(--code-bg); }
  .on-move .clock { color: var(--better); background: var(--published-bg); }
  .king-icon { display: inline-block; width: 1rem; text-align: center; margin-right: .2rem; font-size: .95rem;
               line-height: 1; vertical-align: -1px; }
  .king-icon.white::before { content: "♔"; color: var(--series-white); }
  .king-icon.black::before { content: "♚"; color: var(--series-black); }
  .engine { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .75rem;
            margin-bottom: .6rem; }
  .engine-head { display: flex; flex-wrap: wrap; gap: .1rem .6rem; align-items: baseline; }
  .thinking-badge { margin-left: auto; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .25rem .75rem;
           margin: .4rem 0 0; }
  .stats dt { color: var(--muted); font-size: .75rem; }
  .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
  .pv { margin-top: .4rem; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
  .moves-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); position: relative; }
  .moves-scroll table.moves { margin: 0; }
  table.moves td.num { color: var(--muted); width: 2.5rem; }
  table.moves td.mv a { font-weight: 600; color: var(--fg); }
  table.moves td.mv span { font-size: .75rem; margin-left: .35rem; }
  .metrics { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .4rem; }
  .metric { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px;
            padding: .15rem .7rem; cursor: pointer; }
  .metric.current { background: var(--committed-bg); border-color: var(--committed); font-weight: 600; }
  .legend-lines { margin-left: auto; display: flex; flex-wrap: wrap; gap: .2rem .9rem; font-size: .85rem; }
  .game-extra { margin-top: 1rem; }
  .game-extra .tabs { margin: 0 0 .4rem; }
  .game-graphs { margin-top: 0; }
  .chart { display: block; width: 100%; height: auto; background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; }
  .chart .axis { stroke: var(--muted); stroke-width: 1.2; opacity: .6; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font-size: 9px; }
  .chart .cursor { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .series { fill: none; stroke-width: 1.2; stroke-linejoin: round; }
  .chart .series.white { stroke: var(--series-white); }
  .chart .series.black { stroke: var(--series-black); }
  .chart .bar-white { fill: #d9d9d9; opacity: .85; }
  .chart .bar-black { fill: #111; opacity: .9; }
  /* a match: its progress card, and the opponents as cards in two columns */
  .seg.draw { background: var(--muted); opacity: .55; }
  .key { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .35rem;
         vertical-align: -1px; }
  .key.pass { background: var(--cell-pass); }
  .key.fail { background: var(--cell-fail); }
  .key.draw { background: var(--muted); opacity: .55; }
  .key.newly-passing { background: var(--cell-newly-passing); }
  .key.unearned { border: 1px solid var(--line); }
  .outcome.running { color: var(--committed); background: var(--committed-bg); }
  .outcome.finished { color: var(--better); background: var(--published-bg); }
  .outcome.stopped { color: var(--wip); background: var(--wip-bg); }
  .outcome.card-state { text-transform: none; font-weight: 600; letter-spacing: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem 2rem; margin: .5rem 0 0; }
  .chips dt { color: var(--muted); font-size: .8rem; }
  .chips dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
  .match-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .match-grid > .card { margin: 0; }
  .match-grid .span-all { grid-column: 1 / -1; }
  @media (max-width: 800px) { .match-grid { grid-template-columns: minmax(0, 1fr); } }
  .card.excluded { opacity: .55; }
  .view-switch { display: inline-flex; margin: 0 0 .6rem; border: 1px solid var(--line); border-radius: 6px;
                 overflow: hidden; }
  .view-switch a { padding: .15rem .9rem; color: var(--fg); background: var(--card); }
  .view-switch a + a { border-left: 1px solid var(--line); }
  .view-switch a.current { background: var(--committed-bg); color: var(--committed); font-weight: 600; }
  .view-switch a:hover { text-decoration: none; }
  .faults { display: flex; flex-wrap: wrap; gap: .1rem 1rem; margin-top: .5rem; font-size: .85rem; }
  .facts-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .25rem 2rem; }
  @media (max-width: 800px) { .facts-cols { grid-template-columns: minmax(0, 1fr); } }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:hover { fill: var(--fg); fill-opacity: .07; }
  .chart .series, .chart .dot-white, .chart .dot-black { pointer-events: none; }
  .copy-panels { margin-top: 0; }
  .copy-box { padding: .55rem .7rem; background: var(--code-bg); }
  .copy-panels .card { margin: .5rem 0 0; }
  .copy-box-head { display: flex; gap: .5rem; align-items: center; }
  .copy-label { color: var(--muted); font-weight: 600; }
  .copy-feedback { margin-left: .35rem; font-size: .82rem; }
  .copy-button { border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--fg);
                 cursor: pointer; min-width: 4.8rem; padding: .2rem .5rem; margin: 2px 0 2px auto; }
  .copy-button.icon { min-width: 2rem; padding: .1rem .35rem; font-size: 1rem; line-height: 1; }
  .copy-button:hover { border-color: var(--link); }
  .copy-button.done { color: var(--better); border-color: var(--better); }
  .copy-button.failed { color: var(--worse); border-color: var(--worse); }
  .copy-field { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg);
                line-height: 1.35; padding: .3rem .5rem; }
  .copy-box.multi .copy-box-head { margin-bottom: .45rem; }
  .copy-box.multi .copy-field { resize: vertical; min-height: 10rem; background: var(--card); }
  /* a class that sets display would otherwise beat the browser's own rule for the hidden attribute */
  [hidden] { display: none !important; }
  .chart .dot-white { fill: var(--series-white); }
  .chart .dot-black { fill: var(--series-black); }
</style>
</head>
<body>
<header>
  <a class="brand" href="{% url 'runs' %}">nyayo</a>
  <a href="{% url 'runs' %}">Runs</a>
  <a href="{% url 'matches' %}">Matches</a>
  <a href="{% url 'compare' %}">Compare</a>
  <a href="{% url 'admin:index' %}">Admin</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
(function () {
  function fallbackCopy(text, field) {
    var probe = null;
    if (!field || !(field instanceof HTMLTextAreaElement || field instanceof HTMLInputElement)) {
      probe = document.createElement("textarea");
      probe.value = text;
      probe.setAttribute("readonly", "");
      probe.style.position = "fixed";
      probe.style.opacity = "0";
      document.body.appendChild(probe);
      field = probe;
    }
    field.focus();
    field.select();
    try {
      return document.execCommand("copy");
    } finally {
      if (probe) document.body.removeChild(probe);
    }
  }

  function copy(text, field) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return fallbackCopy(text, field); });
    }
    return Promise.resolve(fallbackCopy(text, field));
  }

  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-copy-target]");
    if (!button) return;
    var target = document.getElementById(button.dataset.copyTarget || "");
    if (!target) return;
    var text = target.dataset.copyValue || ("value" in target ? target.value : target.textContent);
    var feedback = button.closest(".copy-box") ? button.closest(".copy-box").querySelector("[data-copy-feedback]") : null;
    var label = button.dataset.copyLabel || "Copy";
    if (!text) return;

    copy(text, target).then(function (ok) {
      button.classList.remove("done", "failed");
      button.classList.add(ok ? "done" : "failed");
      button.textContent = ok ? "✓" : "✕";
      if (feedback) feedback.textContent = ok ? "Copied to clipboard." : "Could not copy.";
      setTimeout(function () {
        button.classList.remove("done", "failed");
        button.textContent = label;
        if (feedback) feedback.textContent = "";
      }, 1800);
    });
  });
})();
</script>
</body>
</html>

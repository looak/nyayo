[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayo"
version = "0.1.0"
description = "Smoke tests and their history for a chess engine"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "Django>=5.2,<6",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
    "zstandard>=0.23",
    "gunicorn>=23; sys_platform != 'win32'",
]

[tool.setuptools.packages.find]
include = ["nyayo*"]

[tool.setuptools.package-data]
nyayo = ["templates/**/*"]
